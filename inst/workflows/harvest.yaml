# Weekly harvest of the organisation into the registry. Opens a pull request; never pushes to main.
name: harvest
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: github::openwashdata/owdpublish
      - name: Clone the organisation's packages
        run: |
          mkdir -p packages && cd packages
          gh repo list openwashdata --limit 200 --json name,url --jq '.[] | .url' | while read u; do git clone -q --depth 1 "$u" || true; done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Harvest
        run: Rscript -e 'owdpublish::owd_harvest("packages", "registry")'
      - uses: peter-evans/create-pull-request@v6
        with:
          title: "harvest: registry refresh"
          branch: harvest/refresh
          add-paths: registry/
