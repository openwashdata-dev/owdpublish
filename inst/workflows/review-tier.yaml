# The publication floor as a GitHub Action: contract check, required checks, AI statement check.
# Runs in the data package repository on every push and pull request to main and dev.
name: review-tier
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::washr, any::desc, any::jsonlite, any::yaml, github::openwashdata/owdpublish
      - name: Contract, floor, statement
        run: |
          Rscript -e '
            owdpublish::owd_contract_check(".")
            owdpublish::owd_export_metadata(".")
            owdpublish::owd_ai_statement(".")
            res <- owdpublish::owd_required_checks(".")
            ok <- owdpublish::owd_check_ai_statement(".")
            if (!all(res$pass[res$tier == "required"]) || !isTRUE(ok)) quit(status = 1)'
      - uses: actions/upload-artifact@v4
        with:
          name: review-reports
          path: review/
